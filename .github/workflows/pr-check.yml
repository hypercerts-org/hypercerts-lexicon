name: PR Check

on:
  pull_request:
    branches: [main, develop, "release/**"]
    # `edited` re-runs the Release PR check when the Docs PR link is added.
    types: [opened, synchronize, reopened, edited]

jobs:
  changeset-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Check Lexicon versioning and Release PR review
        run: node scripts/check-release-policy.mjs "origin/${{ github.base_ref }}"
      - name: Check prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            mode=$(node -e "console.log(require('./.changeset/pre.json').mode)")
            if [ "$mode" = "pre" ]; then
              echo "::error::Active prerelease mode must be exited before merging to main."
              echo "Run 'npx changeset pre exit' on the prerelease branch and commit the change."
              exit 1
            fi
            echo "Prerelease mode is not active (mode=$mode)"
          else
            echo "No prerelease mode detected"
          fi
