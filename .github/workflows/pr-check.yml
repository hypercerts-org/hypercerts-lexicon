name: PR Check

on:
  pull_request:
    branches: [main, develop, "release/**"]
    # `edited` re-runs the Release PR check when the Docs PR link is added.
    types: [opened, synchronize, reopened, edited]

jobs:
  changeset-check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pnpm
        # Reads the pnpm version from the packageManager field in package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Lexicon versioning and Release PR review
        run: node scripts/check-release-policy.mjs "origin/${{ github.base_ref }}"
      - name: Check prerelease mode
        run: |
          if [ -f .changeset/pre.json ]; then
            mode=$(node -e "console.log(require('./.changeset/pre.json').mode)")
            if [ "$mode" = "pre" ]; then
              echo "::error::Active prerelease mode must be exited before merging to main."
              echo "Run 'pnpm changeset pre exit' on the prerelease branch and commit the change."
              exit 1
            fi
            echo "Prerelease mode is not active (mode=$mode)"
          else
            echo "No prerelease mode detected"
          fi
