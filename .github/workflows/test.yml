name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Reads the pnpm version from the packageManager field in package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch lex-cli to fix validation exit code bug
        run: |
          sed -i 's|// skip|throw e;|g' node_modules/@atproto/lex-cli/dist/util.js

      - name: Generate SCHEMAS.md
        run: pnpm gen-schemas-md

      - name: Ensure SCHEMAS.md up to date / no diffs in worktree
        run: git diff --exit-code

      - name: Run checks
        run: pnpm check

      - name: Check the packed package in a clean consumer
        run: pnpm check:package
