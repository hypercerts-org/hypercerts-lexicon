name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions: {}

concurrency:
  # Serialize updates per event/ref without letting a main push replace a
  # pending merged-Release-PR publication run.
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Validate stable release and select Changesets mode
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify no active prerelease mode
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            mode="$(node -e "console.log(require('./.changeset/pre.json').mode)")"
            if [ "$mode" = "pre" ]; then
              echo "::error::Active prerelease mode detected on main."
              echo "Exit prerelease mode on the prerelease branch before merging it to main."
              exit 1
            fi
            echo "Prerelease mode is not active (mode=$mode)"
          else
            echo "No prerelease mode detected"
          fi

      - name: Validate package
        run: npm run check

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  version:
    name: Create or update stable Release PR
    if: github.event_name == 'push' && needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Release Bot App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version package and update Release PR
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: npm run version-packages
          commit-message: "release: version packages"
          pr-title: Release
          pr-base-branch: main
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      # The split version action takes a static PR title, so restore the
      # versioned title used by the existing release workflow.
      - name: Rename Release PR with version
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head changeset-release/main \
            --base main \
            --state open \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -z "$pr_number" ]; then
            echo "No open changeset-release/main PR to rename"
            exit 0
          fi

          version="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=changeset-release/main" \
            -H "Accept: application/vnd.github.raw" \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if [ -z "$version" ]; then
            echo "::error::Could not read package version from changeset-release/main"
            exit 1
          fi

          title="Release v$version"
          echo "Renaming PR #$pr_number to: $title"
          gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title"

  publish:
    name: Validate and publish stable release
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate Release Bot App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::The merged Release pull request did not provide a merge commit SHA"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected commit $EXPECTED_SHA but checked out $actual_sha"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishers
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Validate release commit
        run: npm run check

      - name: Verify no active prerelease mode
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            mode="$(node -e "console.log(require('./.changeset/pre.json').mode)")"
            if [ "$mode" = "pre" ]; then
              echo "::error::Active prerelease mode detected in the stable release commit."
              echo "Exit prerelease mode before merging the Release PR."
              exit 1
            fi
            echo "Prerelease mode is not active (mode=$mode)"
          else
            echo "No prerelease mode detected"
          fi

      - name: Publish npm package, tags, and GitHub Release
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: true

  beta:
    name: Publish beta release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate prerelease branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            refs/heads/prerelease/*)
              echo "Detected beta release from ${RELEASE_REF#refs/heads/}"
              ;;
            *)
              echo "::error::Manual release dispatch is only supported from 'prerelease/*' branches."
              echo "Stable releases are prepared automatically after pushes to main and published when the Release PR is merged."
              exit 1
              ;;
          esac

      - name: Generate Release Bot App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out prerelease commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishers
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Validate prerelease package
        run: npm run check

      - name: Verify prerelease mode
        run: |
          set -euo pipefail
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::Prerelease mode is not active."
            echo "Run 'npx changeset pre enter beta' and commit before dispatching this workflow."
            exit 1
          fi
          mode="$(node -e "console.log(require('./.changeset/pre.json').mode)")"
          if [ "$mode" != "pre" ]; then
            echo "::error::Prerelease mode has been exited (mode=$mode)."
            echo "Re-enter with 'npx changeset pre enter beta' or merge to main for a stable release."
            exit 1
          fi
          echo "Prerelease mode is active"

      - name: Check for pending beta changesets
        id: beta-changesets
        run: |
          set -euo pipefail
          if ! find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name README.md ! -name AGENTS.md ! -name CLAUDE.md ! -name GEMINI.md \
            -print -quit | grep -q .; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "No pending beta changesets; skipping versioning and publication."
            exit 0
          fi
          status_file="$RUNNER_TEMP/beta-changesets.json"
          npx --no-install changeset status --output "$status_file"
          pending="$(node --input-type=module - "$status_file" <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log(status.changesets.some(change =>
            !change.id.startsWith('pre/') && change.releases.length > 0
          ));
          NODE
          )"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = "false" ]; then
            echo "No pending beta changesets; skipping versioning and publication."
          fi

      - name: Version packages (beta)
        if: steps.beta-changesets.outputs.pending == 'true'
        run: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Commit and push version changes (beta)
        if: steps.beta-changesets.outputs.pending == 'true'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "Versioning to: $version"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "release: version beta package $version"
          git push

      - name: Publish beta package
        if: steps.beta-changesets.outputs.pending == 'true'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true

      - name: Push beta git tags
        if: steps.beta-changesets.outputs.pending == 'true'
        run: git push origin --tags

      - name: Log beta release
        if: steps.beta-changesets.outputs.pending == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "Published beta release: $version"
